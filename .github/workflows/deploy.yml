name: Deploy to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p ${{ secrets.CPANEL_PORT }} \
            -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync Project
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.CPANEL_PORT }}" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".next" \
            ./ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_APP_PATH }}/

      - name: Build on Server
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.CPANEL_PORT }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'

          source /home/alphuncv/nodevenv/eyeinteraction.com/22/bin/activate

          cd /home/alphuncv/eyeinteraction.com

          if [ package.json -nt node_modules ]; then
            echo "Installing dependencies..."
            npm install
          else
            echo "Dependencies already installed."
          fi

          npm run build

          if command -v ea-passenger-runtime-app-restart >/dev/null 2>&1; then
              ea-passenger-runtime-app-restart /home/alphuncv/eyeinteraction.com
          else
              echo "Passenger restart command not found."
          fi

          EOF