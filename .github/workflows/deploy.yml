name: Deploy to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p ${{ secrets.CPANEL_PORT }} \
            -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Sync project
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.CPANEL_PORT }}" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            ./ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_APP_PATH }}/

      - name: Install production dependencies
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.CPANEL_PORT }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << EOF

          source /home/alphuncv/nodevenv/eyeinteraction.com/22/bin/activate

          cd /home/alphuncv/eyeinteraction.com

          npm install --omit=dev

          mkdir -p tmp
          touch tmp/restart.txt

          EOF